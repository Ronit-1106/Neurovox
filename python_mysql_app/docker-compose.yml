version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: neurovox_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: neurovox_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.mysql.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    container_name: neurovox_python_web
    restart: always
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: neurovox_db
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  mysql_data:
